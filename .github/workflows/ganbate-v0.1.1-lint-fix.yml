name: Prepare Ganbate Audio Core Lint-Compatible Pin

on:
  push:
    branches: [compat/ganbate-v0.1.1-lint-fix]

permissions:
  contents: write

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

jobs:
  repair:
    if: "${{ github.event.head_commit.message == 'ci: retry Ganbate audio-core lint-compatible pin' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.127
      - run: corepack enable
      - name: Install exact v0.1.1 TypeScript package
        working-directory: typescript
        run: pnpm install --frozen-lockfile
      - name: Replace only the ten test lint suppressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          paths = [
              Path('typescript/tests/cache-policy.test.ts'),
              Path('typescript/tests/web-audio.test.ts'),
          ]
          total = 0
          for path in paths:
              source = path.read_text()
              source, count = re.subn(
                  r'^(\s*)void ([A-Za-z_$][\w$]*);$',
                  r'\1Boolean(\2);',
                  source,
                  flags=re.MULTILINE,
              )
              total += count
              path.write_text(source)
          if total != 10:
              raise SystemExit(f'expected 10 lint suppressions, replaced {total}')
          PY
          rm .github/workflows/ganbate-v0.1.1-lint-fix.yml
          git diff --check
      - name: Validate exact publishable v0.1.1 TypeScript package
        working-directory: typescript
        run: pnpm prepack
      - name: Commit and publish minimal compatibility pin
        run: |
          git config user.name 'Audio Core Maintenance'
          git config user.email '48481888+abrahamahn@users.noreply.github.com'
          git add \
            typescript/tests/cache-policy.test.ts \
            typescript/tests/web-audio.test.ts \
            .github/workflows/ganbate-v0.1.1-lint-fix.yml
          git diff --cached --check
          git commit -m 'test(typescript): make v0.1.1 package lint-compatible'
          test -z "$(git status --porcelain)"
          git push origin HEAD:compat/ganbate-v0.1.1-lint-fix
