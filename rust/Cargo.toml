[package]
name = "abrahamahn-audio-core"
description = "Portable audio effect contracts and DSP processors"
documentation = "https://docs.rs/abrahamahn-audio-core"
edition.workspace = true
homepage = "https://github.com/abrahamahn/audio-core"
license.workspace = true
readme = "README.md"
repository = "https://github.com/abrahamahn/audio-core"
rust-version.workspace = true
version.workspace = true

[lib]
name = "audio_core"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = []
wasm = ["dep:wasm-bindgen"]

[dependencies]
wasm-bindgen = { version = "=0.2.127", optional = true }

[dev-dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[lints]
workspace = true
